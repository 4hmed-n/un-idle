name: Build Un-Idle

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable with PyInstaller
        run: pyinstaller --clean --noconfirm un-idle.spec
      - name: Generate SHA256 checksum
        run: |
          $hash = (Get-FileHash dist\un-idle.exe -Algorithm SHA256).Hash
          "$hash  un-idle.exe" | Out-File -FilePath dist\un-idle.exe.sha256 -Encoding ascii
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: un-idle-windows
          path: |
            dist/un-idle.exe
            dist/un-idle.exe.sha256
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/un-idle.exe
            dist/un-idle.exe.sha256
          body: |
            Windows build for Un-Idle ${{ github.ref_name }}
            
            **Installation:**
            1. Download `un-idle.exe`
            2. Run it - the app appears in your system tray (look for the green circle icon)
            3. Right-click the tray icon for settings
            
            **Verification:**
            Use `un-idle.exe.sha256` to verify download integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --clean --noconfirm un-idle.spec
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: un-idle-macos
          path: dist/un-idle

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libx11-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build binary with PyInstaller
        run: pyinstaller --clean --noconfirm un-idle.spec
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: un-idle-linux
          path: dist/un-idle
